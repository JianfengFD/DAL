name: Validate game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 blender/validate_assets.py
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: DAL-portable
          path: releases/DAL-*-portable.zip
          if-no-files-found: error
